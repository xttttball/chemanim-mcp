[project]
name = "chemanim"
version = "0.2.0"
description = "Generate verified chemistry animations with DeepSeek, PubChem, RDKit, and Manim"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "manim>=0.20.0,<0.21",
    "mcp>=2,<3",
    "pydantic>=2.11,<3",
    "rdkit>=2025.9",
]

[project.scripts]
chemanim = "chemanim.cli:main"
chemanim-mcp = "chemanim.mcp_server:main"
chemanim-probe = "chemanim.probe_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemanim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
