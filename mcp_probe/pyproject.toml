[project]
name = "chemanim-probe"
version = "0.2.0"
description = "Minimal MCP 1.5 probe for iFlytek hosted tool discovery testing"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.5.0",
]

[project.scripts]
chemanim-probe = "chemanim_probe.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemanim_probe"]
