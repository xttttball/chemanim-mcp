[project]
name = "chemanim-probe"
version = "0.1.0"
description = "Minimal MCP probe for hosted tool discovery testing"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=2,<3",
]

[project.scripts]
chemanim-probe = "chemanim_probe.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemanim_probe"]
